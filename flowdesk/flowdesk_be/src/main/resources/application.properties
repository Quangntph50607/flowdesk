spring.application.name=flowdesk_be

# ===== Datasource =====
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== JWT =====
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-days=${APP_JWT_REFRESH_EXPIRATION_DAYS:7}

# ===== Backblaze B2 / S3-compatible storage =====
app.storage.b2.endpoint=${B2_ENDPOINT}
app.storage.b2.region=${B2_REGION}
app.storage.b2.bucket-name=${B2_BUCKET_NAME}
app.storage.b2.key-id=${B2_KEY_ID}
app.storage.b2.application-key=${B2_APPLICATION_KEY}

# ===== Multipart File Upload =====
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB
